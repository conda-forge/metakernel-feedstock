{% set version = "1.0.7" %}
{% set python_min = "3.11" %}

package:
  name: metakernel
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/m/metakernel/metakernel-{{ version }}.tar.gz
  sha256: 499a0e399e353e0fb4a74e105ea2ad2aed89a15053a299f5fa93c027d721743a

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - python {{ python_min }}
    - pip
    - poetry >=2.3.1
  run:
    - ipykernel >5.5.6
    - jedi >=0.18
    - jupyter_core >=4.9.2
    - pexpect >=4.8
    - python >={{ python_min }}
    # extras
    - ipyparallel
    - portalocker

test:
  imports:
    - metakernel
    - metakernel.magics
    - metakernel.utils
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/Calysto/metakernel
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: Metakernel for Jupyter.

extra:
  recipe-maintainers:
    - ocefpaf
    - ericdill
    - mariusvniekerk
    - blink1073
    - dsblank
