{% set version = "0.32.0" %}

package:
  name: metakernel
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/m/metakernel/metakernel-{{ version }}.tar.gz
  sha256: 031984b4c0629c129c86162d27bd8df264d6993bf961aec730fdb71facefddbc

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - python {{ python_min }}
    - pip
    - hatchling >=1.5
  run:
    - ipykernel >5.5.6
    - jedi >=0.18
    - jupyter_core >=4.9.2
    - pexpect >=4.8
    - python >={{ python_min }}
    # extras
    - ipyparallel
    - portalocker

test:
  imports:
    - metakernel
    - metakernel.magics
    - metakernel.utils
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/Calysto/metakernel
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: Metakernel for Jupyter.

extra:
  recipe-maintainers:
    - ocefpaf
    - ericdill
    - mariusvniekerk
    - blink1073
    - dsblank
